apiVersion: 1

deleteDatasources:
  - name: SOLIS InfluxDB
    orgId: 1

datasources:
  - name: SOLIS InfluxDB
    uid: influxdb-solis
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: ${INFLUXDB_ORG}
      defaultBucket: ${INFLUXDB_BUCKET}
      tlsSkipVerify: false
    secureJsonData:
      token: ${INFLUXDB_ADMIN_TOKEN}
