per_listener_settings true

# Listener interno: solo visible dentro de la red Docker del MVP.
listener 1883 0.0.0.0
allow_anonymous true

# Listener del gateway: publicado en el host y protegido con credenciales.
listener 1884 0.0.0.0
allow_anonymous false
password_file /mosquitto/data/passwords
acl_file /mosquitto/data/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 60
user mosquitto

max_packet_size 1048576
message_size_limit 262144
max_queued_messages 1000

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
